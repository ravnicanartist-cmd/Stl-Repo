<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Library List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfa;--ink:#1d1d1d;--soft:#8a8a8a;--accent:#f0960e;--chip:#f1efeb;--line:#e6e3dd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Varela Round",system-ui,sans-serif;font-size:17px;line-height:1.45;padding:20px 16px 60px}
.wrap{max-width:1180px;margin:0 auto}
header{text-align:center;position:relative;padding:4px 0 6px}
h1{font-family:"Caveat",cursive;font-size:clamp(40px,7vw,60px);margin:0;line-height:1;position:relative;z-index:1}
.swoosh{display:block;margin:-14px auto 0;width:min(520px,90%);height:34px}
.count{color:var(--soft);font-size:14px;margin:4px 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.toggles button{font:inherit;font-size:15px;border:2px solid var(--chip);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.toggles button .n{color:var(--soft);font-size:13px;margin-left:4px}
.toggles button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.toggles button[aria-pressed=true] .n{color:#fff;opacity:.85}
.toggles button:disabled{opacity:.45;cursor:default}
.search{display:block;margin:10px auto 0;width:min(380px,100%);font:inherit;font-size:15px;padding:8px 14px;border:2px solid var(--line);border-radius:999px;background:#fff;outline:none}
.search:focus{border-color:var(--accent)}
.cols{columns:3 300px;column-gap:40px}
.game{break-before:column}
.game:first-child{break-before:auto}
h2{font-family:"Nunito",sans-serif;font-weight:800;font-size:22px;margin:0 0 4px;break-after:avoid}
.fac{break-inside:avoid;margin:0 0 16px}
.fac.big{break-inside:auto}
h3{font-family:"Nunito",sans-serif;font-weight:800;font-size:18px;margin:0 0 2px;break-after:avoid}
h3 .n{font-family:"Varela Round",sans-serif;font-weight:400;color:var(--soft);font-size:14px;margin-left:4px}
ul{margin:0;padding:0 0 0 38px;list-style:none}
li{position:relative;padding:1px 0}
li::before{content:"";position:absolute;left:-20px;top:.62em;width:7px;height:7px;border:1.6px solid var(--ink);border-radius:50%}
li a{color:inherit;text-decoration:none}
li a:hover{color:var(--accent)}
.meta{color:var(--soft);font-size:14px}
.flag{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b5650a;background:#fdf0dc;border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px}
.empty{text-align:center;color:var(--soft);margin:40px 0}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Scan Library List</h1>
    <svg class="swoosh" viewBox="0 0 520 34" aria-hidden="true"><path d="M8 26 C 120 6, 360 4, 470 12 S 520 22, 500 30" fill="none" stroke="#f0960e" stroke-width="7" stroke-linecap="round"/></svg>
    <p class="count" id="count">Loading…</p>
  </header>
  <div class="bar">
    <div class="toggles" id="toggles"></div>
    <input class="search" id="q" type="search" placeholder="Search a kit or faction" aria-label="Search">
  </div>
  <div class="cols" id="list"></div>
  <footer><span class="flag">CHECK</span> / <span class="flag">COMPARE</span> = scan still being verified. Tap a name to see pictures. <span id="updated"></span></footer>
</div>
<script>
const GAMES=["Warhammer 40K","Age of Sigmar","The Old World","Kill Team","Horus Heresy"];
const SHORT={"Warhammer 40K":"40K","Age of Sigmar":"Age of Sigmar","The Old World":"The Old World","Kill Team":"Kill Team","Horus Heresy":"Horus Heresy"};
const GAMEQ={"Warhammer 40K":"Warhammer 40k","The Old World":"Warhammer The Old World"};
const FIX={"Chaos":"Chaos Space Marines","Emperors Children":"Emperor's Children","HH":""};
let items=[],game=null;

function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){row.push(f);f=""}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f="";if(row.some(x=>x))rows.push(row);row=[]}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function clean(g,fac,raw){
  let n=raw.replace(/\.(zip|7z|rar|obj|stl|lys|chitubox)$/i,"").replace(/^\s*SCAN\s*-\s*/i,"");
  let mark="";const m=n.match(/\s*-\s*(CHECK|COMPARE)\s*$/i);if(m){mark=m[1].toUpperCase();n=n.slice(0,m.index)}
  let f=fac.replace(/^CSM - /,"");f=FIX[f]??f;
  const seg=n.split(" - ");
  if(seg.length>1){let pre=seg.shift();
    if(["HH","SM","CSM"].includes(pre)&&seg.length>1&&!f)pre=seg.shift();
    if(!f)f=FIX[pre]??pre;
    if(seg.length>1&&seg[0].length<=4)seg.shift()}
  n=seg.join(" – ");
  let yr="";const y=n.match(/\((\d{4})\)\s*$/);if(y){yr=y[1];n=n.slice(0,y.index).trim()}
  let note="";const nt=n.match(/\(([^()]*)\)\s*$/);if(nt&&nt[1].length<40){note=nt[1];n=n.slice(0,nt.index).trim()}
  const ny=note.match(/^(\d{4}),\s*(.*)$/);if(ny&&!yr){yr=ny[1];note=ny[2]}
  return {g,f:f||"Other",n,yr,note,mark}}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const pool=items.filter(i=>(q||i.g==game)&&(!q||(i.n+" "+i.f+" "+i.note).toLowerCase().includes(q)));
  const gs=GAMES.filter(g=>pool.some(i=>i.g==g)).concat([...new Set(pool.map(i=>i.g))].filter(g=>!GAMES.includes(g)));
  let h="";
  gs.forEach(g=>{
    const gi=pool.filter(i=>i.g==g);
    if(q)h+=`<div class="game"><h2>${esc(g)}:</h2></div>`;
    [...new Set(gi.map(i=>i.f))].sort().forEach(f=>{
      const fi=gi.filter(i=>i.f==f).sort((a,b)=>a.n.localeCompare(b.n));
      h+=`<div class="fac${fi.length>18?" big":""}"><h3>${esc(f)}:<span class="n">${fi.length}</span></h3><ul>`;
      fi.forEach(i=>{
        const url="https://www.google.com/search?tbm=isch&q="+encodeURIComponent((GAMEQ[g]||g)+" "+i.f+" "+i.n);
        const meta=[i.note,i.yr].filter(Boolean).join(", ");
        h+=`<li><a href="${url}" target="_blank" rel="noopener">${esc(i.n)}</a>${meta?` <span class="meta">(${esc(meta)})</span>`:""}${i.mark?`<span class="flag">${i.mark}</span>`:""}</li>`});
      h+=`</ul></div>`})});
  document.getElementById("list").innerHTML=h||`<p class="empty">Nothing matches that.</p>`;
  const n=pool.length;document.getElementById("count").textContent=q?`${n} matching scans across all games`:`${n} scans in ${game}`;
}
function toggles(){
  document.getElementById("toggles").innerHTML=GAMES.map(g=>{const c=items.filter(i=>i.g==g).length;
    return `<button data-g="${esc(g)}" aria-pressed="${g==game}"${c?"":" disabled"}>${SHORT[g]}<span class="n">${c||"soon"}</span></button>`}).join("");
  document.querySelectorAll("#toggles button").forEach(b=>b.onclick=()=>{game=b.dataset.g;document.getElementById("q").value="";
    try{localStorage.setItem("scan-game",game)}catch(e){}toggles();render()});
}
fetch("scans.csv?"+Date.now()).then(r=>{const lm=r.headers.get("last-modified");
  if(lm)document.getElementById("updated").textContent="Updated "+new Date(lm).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+".";
  return r.text()}).then(t=>{
  const rows=parseCSV(t.replace(/^﻿/,""));rows.shift();const seen=new Set();
  rows.forEach(([g,f,n])=>{if(!n)return;const it=clean(g,f||"",n);const k=[it.g,it.f,it.n,it.note,it.yr].join("|");if(!seen.has(k)){seen.add(k);items.push(it)}});
  let saved=null;try{saved=localStorage.getItem("scan-game")}catch(e){}
  game=GAMES.find(g=>g==saved&&items.some(i=>i.g==g))||GAMES.find(g=>items.some(i=>i.g==g));
  toggles();render();
}).catch(()=>{document.getElementById("count").textContent="Couldn't load the scan list."});
document.getElementById("q").addEventListener("input",render);
</script>
</body>
</html>
